name: Check PDF tools
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build the production image
        run: docker build -t sygpdf-ci .
      - name: Check PDF tools
        run: docker run --rm -v "$PWD/tests:/app/tests:ro" sygpdf-ci python tests/check.py
      - name: Check HTTPS hosting configuration
        run: |
          docker run --rm -v "$PWD/tests:/app/tests:ro" \
            -e RENDER_EXTERNAL_URL=https://sygpdf-test.example \
            -e SYGPDF_TEST_HOST=sygpdf-test.example \
            -e SYGPDF_TEST_ORIGIN=https://sygpdf-test.example \
            sygpdf-ci python tests/check.py
      - name: Check hosting boundaries
        run: docker run --rm -v "$PWD/tests:/app/tests:ro" sygpdf-ci python tests/hosting.py
