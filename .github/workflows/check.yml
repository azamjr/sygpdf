name: Check PDF tools
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer tesseract-ocr-eng libseccomp2
      - run: pip install -r requirements.txt
      - run: python tests/check.py

      - name: Check HTTPS hosting configuration
        run: python tests/check.py
        env:
          RENDER_EXTERNAL_URL: https://sygpdf-test.example
          SYGPDF_TEST_HOST: sygpdf-test.example
          SYGPDF_TEST_ORIGIN: https://sygpdf-test.example
      - name: Check hosting boundaries
        run: python tests/hosting.py
